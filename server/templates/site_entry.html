<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>进入罗瓣</title>
  <link rel="icon" href="/assets/logo-snail.png" type="image/png">
  <link rel="stylesheet" href="/assets/site-entry.css?v=1">

</head>
<body>
  <main>
    <img src="/assets/logo-snail.png" width="70" height="70" alt="">

  </main>
